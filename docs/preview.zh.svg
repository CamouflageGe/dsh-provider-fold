<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="DSH 自带的模型菜单里，提供商标题可点击折叠：展开的 GPT 网关显示三个模型，其余提供商收起并显示模型数量">
  <title>dsh-model-picker —— 给自带模型菜单加上可折叠的提供商分组</title>

  <defs>
    <clipPath id="menuClip">
      <rect x="330" y="60" width="360" height="520" rx="12"/>
    </clipPath>
  </defs>

  <!-- 深色画布 -->
  <rect width="960" height="640" fill="rgb(21,21,23)"/>

  <!-- 背景中隐约的对话内容 -->
  <g opacity="0.20">
    <rect x="120" y="120" width="300" height="12" rx="6" fill="rgb(53,54,56)"/>
    <rect x="120" y="146" width="380" height="12" rx="6" fill="rgb(44,44,46)"/>
    <rect x="120" y="172" width="240" height="12" rx="6" fill="rgb(44,44,46)"/>
  </g>

  <!-- ===== 自带的模型菜单卡片 ===== -->
  <g clip-path="url(#menuClip)">
    <rect x="330" y="60" width="360" height="520" fill="rgb(44,44,46)"/>

    <!-- 搜索框（自带能力，模型超过 4 个时出现） -->
    <g>
      <circle cx="356" cy="92" r="6" fill="none" stroke="rgb(129,133,140)" stroke-width="1.5"/>
      <path d="M361 97 L365 101" stroke="rgb(129,133,140)" stroke-width="1.5" stroke-linecap="round"/>
      <text x="376" y="97" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12" fill="rgb(129,133,140)">搜索模型或提供商…</text>
    </g>

    <!-- ===== 分组 1：展开 ===== -->
    <g>
      <!-- 折叠指示：向下的箭头（展开态） -->
      <path d="M348 128 L352 133 L356 128" fill="none" stroke="rgb(173,178,184)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="133" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
            font-weight="500" fill="rgb(249,250,251)">GPT 网关</text>
      <text x="674" y="133" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="11" fill="rgb(129,133,140)">3</text>
    </g>

    <!-- 当前模型：高亮 + 勾选 -->
    <rect x="340" y="144" width="340" height="32" rx="8" fill="rgb(255,255,255)" fill-opacity="0.08"/>
    <text x="364" y="165" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
          font-weight="500" fill="rgb(249,250,251)">GPT-6.2 Sol</text>
    <path d="M650 154 L654 159 L661 150" fill="none" stroke="rgb(122,170,255)" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 其它模型，带提供商徽章 -->
    <text x="364" y="197" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
          fill="rgb(249,250,251)">GPT-6.2 Astra</text>
    <rect x="462" y="183" width="62" height="17" rx="6" fill="rgb(53,54,56)"/>
    <text x="493" y="195" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
          font-size="9.5" font-weight="500" fill="rgb(207,211,214)">订阅专属</text>

    <text x="364" y="229" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
          fill="rgb(249,250,251)">GPT-6.1 Terra</text>
    <rect x="462" y="215" width="50" height="17" rx="6" fill="rgb(53,54,56)"/>
    <text x="487" y="227" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
          font-size="9.5" font-weight="500" fill="rgb(207,211,214)">-50%</text>

    <line x1="340" y1="244" x2="680" y2="244" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>

    <!-- ===== 分组 2-6：已折叠 ===== -->
    <!-- 折叠态：向右的箭头 + 变淡的标题 + 模型数量 -->
    <g>
      <path d="M348 270 L353 274.5 L348 279" fill="none" stroke="rgb(173,178,184)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="279" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
            font-weight="500" fill="rgb(173,178,184)">DeepSeek 账号</text>
      <text x="674" y="279" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="11" fill="rgb(129,133,140)">12</text>
    </g>
    <g>
      <path d="M348 306 L353 310.5 L348 315" fill="none" stroke="rgb(173,178,184)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="315" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
            font-weight="500" fill="rgb(173,178,184)">月之暗面</text>
      <text x="674" y="315" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="11" fill="rgb(129,133,140)">4</text>
    </g>
    <g>
      <path d="M348 342 L353 346.5 L348 351" fill="none" stroke="rgb(173,178,184)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="351" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
            font-weight="500" fill="rgb(173,178,184)">智谱 AI</text>
      <text x="674" y="351" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="11" fill="rgb(129,133,140)">5</text>
    </g>
    <g>
      <path d="M348 378 L353 382.5 L348 387" fill="none" stroke="rgb(173,178,184)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="387" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
            font-weight="500" fill="rgb(173,178,184)">阿里通义</text>
      <text x="674" y="387" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="11" fill="rgb(129,133,140)">6</text>
    </g>
    <g>
      <path d="M348 414 L353 418.5 L348 423" fill="none" stroke="rgb(173,178,184)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="423" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
            font-weight="500" fill="rgb(173,178,184)">MiniMax</text>
      <text x="674" y="423" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="11" fill="rgb(129,133,140)">3</text>
    </g>
    <g>
      <path d="M348 450 L353 454.5 L348 459" fill="none" stroke="rgb(173,178,184)" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="364" y="459" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.5"
            font-weight="500" fill="rgb(173,178,184)">阶跃星辰</text>
      <text x="674" y="459" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
            font-size="11" fill="rgb(129,133,140)">2</text>
    </g>

    <!-- 推理强度行（自带能力，仍在） -->
    <line x1="330" y1="492" x2="690" y2="492" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
    <text x="348" y="515" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5"
          fill="rgb(173,178,184)">推理强度</text>
    <rect x="404" y="503" width="34" height="18" rx="9" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
    <text x="421" y="516" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
          font-size="10" fill="rgb(207,211,214)">低</text>
    <rect x="444" y="503" width="34" height="18" rx="9" fill="none" stroke="rgb(122,170,255)"/>
    <text x="461" y="516" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
          font-size="10" fill="rgb(249,250,251)">高</text>
    <rect x="484" y="503" width="40" height="18" rx="9" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
    <text x="504" y="516" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
          font-size="10" fill="rgb(207,211,214)">最高</text>

    <!-- Agent 团队开关（其它插件的贡献，照常显示） -->
    <line x1="330" y1="536" x2="690" y2="536" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
    <text x="348" y="560" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5"
          fill="rgb(173,178,184)">启用 Agent 团队</text>
    <rect x="628" y="548" width="30" height="16" rx="8" fill="rgb(53,54,56)"/>
    <circle cx="636" cy="556" r="6" fill="rgb(173,178,184)"/>
  </g>

  <!-- 菜单描边 -->
  <rect x="330" y="60" width="360" height="520" rx="12" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>

  <!-- ===== 注释：默认只展开当前模型所在组 ===== -->
  <g>
    <line x1="330" y1="200" x2="272" y2="200" stroke="rgb(122,170,255)" stroke-width="1.4" stroke-opacity="0.8"/>
    <circle cx="330" cy="200" r="2.6" fill="rgb(122,170,255)"/>
    <text x="24" y="184" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11"
          fill="rgb(249,250,251)">默认只展开你正在用的提供商</text>
    <text x="24" y="202" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(129,133,140)">与当前模型同组，其余自动折叠</text>
  </g>

  <!-- ===== 注释：其余组默认折叠，可点开 ===== -->
  <g>
    <line x1="330" y1="330" x2="272" y2="330" stroke="rgb(173,178,184)" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="330" cy="330" r="2.6" fill="rgb(173,178,184)"/>
    <text x="24" y="314" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11"
          fill="rgb(207,211,214)">其余提供商默认折叠</text>
    <text x="24" y="332" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(129,133,140)">点标题展开，仍显示模型数量</text>
  </g>

  <!-- ===== 注释：分组与搜索是自带能力 ===== -->
  <g>
    <line x1="690" y1="133" x2="740" y2="133" stroke="rgb(173,178,184)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="746" y="129" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(207,211,214)">展开态</text>
    <text x="746" y="143" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="9.5"
          fill="rgb(129,133,140)">显示模型行</text>

    <line x1="690" y1="315" x2="740" y2="315" stroke="rgb(173,178,184)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="746" y="311" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(207,211,214)">折叠态</text>
    <text x="746" y="325" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="9.5"
          fill="rgb(129,133,140)">只留标题</text>
  </g>

  <!-- ===== 标注：未改动的部分 ===== -->
  <g>
    <text x="24" y="392" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(129,133,140)">分组与搜索是 DSH 自带能力，</text>
    <text x="24" y="408" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(129,133,140)">本插件只补「可折叠」这一点。</text>

    <text x="24" y="470" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(129,133,140)">推理强度、Agent 团队开关等</text>
    <text x="24" y="486" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5"
          fill="rgb(129,133,140)">其它插件的内容照常工作。</text>
  </g>

  <!-- 图例 -->
  <text x="480" y="612" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
        font-size="11" fill="rgb(129,133,140)">
    在自带菜单里原地增强 · 不替换任何组件
  </text>
</svg>
