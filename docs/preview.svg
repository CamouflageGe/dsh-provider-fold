<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="The model picker open in the DeepSeek Harness composer, showing providers as collapsible groups with model counts, search results, a current-model row and reasoning-effort chips">
  <title>dsh-model-picker — grouped and searchable model picker</title>

  <defs>
    <clipPath id="panelClip">
      <rect x="248" y="84" width="520" height="500" rx="14"/>
    </clipPath>
  </defs>

  <!-- dimmed conversation behind the dialog -->
  <rect width="960" height="640" fill="rgb(21,21,23)"/>

  <!-- a hint of the conversation behind the overlay -->
  <g opacity="0.30">
    <rect x="150" y="60" width="360" height="14" rx="7" fill="rgb(53,54,56)"/>
    <rect x="150" y="88" width="470" height="14" rx="7" fill="rgb(44,44,46)"/>
    <rect x="150" y="116" width="300" height="14" rx="7" fill="rgb(44,44,46)"/>
    <rect x="150" y="176" width="420" height="14" rx="7" fill="rgb(44,44,46)"/>
    <rect x="150" y="204" width="480" height="14" rx="7" fill="rgb(44,44,46)"/>
    <rect x="120" y="470" width="720" height="120" rx="14" fill="none" stroke="rgb(53,54,56)" stroke-width="1.5"/>
    <rect x="146" y="532" width="40" height="24" rx="8" fill="rgb(44,44,46)"/>
    <rect x="198" y="532" width="52" height="24" rx="8" fill="rgb(44,44,46)"/>
  </g>

  <!-- modal scrim -->
  <rect width="960" height="640" fill="rgb(0,0,0)" opacity="0.55"/>

  <!-- ============ the picker panel ============ -->
  <g clip-path="url(#panelClip)">
    <rect x="248" y="84" width="520" height="500" fill="rgb(35,35,36)"/>

    <!-- header: magnifier + search field text + close -->
    <g>
      <circle cx="278" cy="122" r="6.5" fill="none" stroke="rgb(129,133,140)" stroke-width="1.6"/>
      <path d="M283 127 L288 132" stroke="rgb(129,133,140)" stroke-width="1.6" stroke-linecap="round"/>
      <text x="300" y="127" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="rgb(129,133,140)">gpt</text>
      <g stroke="rgb(173,178,184)" stroke-width="1.4" stroke-linecap="round">
        <path d="M714 117 L726 129"/><path d="M726 117 L714 129"/>
      </g>
    </g>

    <!-- actions row: match count instead of dead expand/collapse -->
    <text x="264" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="rgb(173,178,184)">3 models found</text>
    <line x1="248" y1="172" x2="768" y2="172" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>

    <!-- ===== the one provider whose name matched "gpt", shown expanded ===== -->
    <g>
      <path d="M266 189 L272 195 L266 201" fill="none" stroke="rgb(173,178,184)" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 269 195)"/>
      <text x="284" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgb(249,250,251)">GPT Gateway</text>
      <text x="726" y="200" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(173,178,184)">3</text>
    </g>

    <!-- row: current model, highlighted + check -->
    <rect x="258" y="210" width="500" height="34" rx="8" fill="rgb(255,255,255)" fill-opacity="0.08"/>
    <text x="284" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgb(249,250,251)">GPT-6.2 Sol</text>
    <path d="M736 223 L741 229 L749 219" fill="none" stroke="rgb(122,170,255)" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- row: sibling model with a provider badge chip (the reuse this plugin guarantees) -->
    <text x="284" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="rgb(249,250,251)">GPT-6.2 Astra</text>
    <rect x="392" y="251" width="74" height="18" rx="6" fill="rgb(53,54,56)"/>
    <text x="429" y="264" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="500" fill="rgb(207,211,214)">Pro Only</text>

    <text x="284" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="rgb(249,250,251)">GPT-6.1 Terra</text>
    <rect x="392" y="285" width="58" height="18" rx="6" fill="rgb(53,54,56)"/>
    <text x="421" y="298" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="500" fill="rgb(207,211,214)">-50%</text>

    <!-- ===== the providers folded away, i.e. the long tail this plugin exists for ===== -->
    <line x1="258" y1="318" x2="758" y2="318" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
    <g>
      <path d="M266 333 L272 339 L266 345" fill="none" stroke="rgb(173,178,184)" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="284" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgb(207,211,214)">DeepSeek Account</text>
      <text x="726" y="344" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(173,178,184)">12</text>
    </g>

    <g>
      <path d="M266 367 L272 373 L266 379" fill="none" stroke="rgb(173,178,184)" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="284" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgb(207,211,214)">Moonshot</text>
      <text x="726" y="378" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(173,178,184)">4</text>
    </g>
    <g>
      <path d="M266 401 L272 407 L266 413" fill="none" stroke="rgb(173,178,184)" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="284" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgb(207,211,214)">Zhipu AI</text>
      <text x="726" y="412" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(173,178,184)">5</text>
    </g>
    <g>
      <path d="M266 435 L272 441 L266 447" fill="none" stroke="rgb(173,178,184)" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="284" y="446" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgb(207,211,214)">Alibaba Qwen</text>
      <text x="726" y="446" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(173,178,184)">6</text>
    </g>
    <g>
      <path d="M266 469 L272 475 L266 481" fill="none" stroke="rgb(173,178,184)" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="284" y="480" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgb(207,211,214)">MiniMax</text>
      <text x="726" y="480" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(173,178,184)">3</text>
    </g>
  </g>

  <!-- panel border on top of the clip -->
  <rect x="248" y="84" width="520" height="500" rx="14" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>

  <!-- ============ footer: current model + effort chips ============ -->
  <line x1="248" y1="512" x2="768" y2="512" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
  <g>
    <text x="264" y="536" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="rgb(173,178,184)">Current model</text>
    <text x="352" y="536" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="rgb(249,250,251)">GPT-6.2 Sol</text>

    <text x="470" y="536" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="rgb(173,178,184)">Reasoning effort</text>
    <rect x="574" y="522" width="34" height="20" rx="10" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
    <text x="591" y="536" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(207,211,214)">low</text>
    <rect x="614" y="522" width="38" height="20" rx="10" fill="none" stroke="rgb(122,170,255)"/>
    <text x="633" y="536" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(249,250,251)">high</text>
    <rect x="658" y="522" width="38" height="20" rx="10" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
    <text x="677" y="536" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(207,211,214)">max</text>
  </g>

  <!-- ============ annotation: the entry row inside the built-in menu ============ -->
  <!-- Sits in the empty lower-left gutter, clear of every provider row. -->
  <g>
    <line x1="258" y1="556" x2="298" y2="536" stroke="rgb(122,170,255)" stroke-width="1.5" stroke-opacity="0.75"/>
    <circle cx="258" cy="556" r="3" fill="rgb(122,170,255)"/>

    <!-- a miniature of the built-in model menu, with the entry row it now carries -->
    <g>
      <rect x="24" y="466" width="234" height="76" rx="10" fill="rgb(44,44,46)"
            stroke="rgb(255,255,255)" stroke-opacity="0.06"/>
      <!-- the entry row, highlighted because it is the new thing -->
      <rect x="32" y="474" width="218" height="30" rx="8" fill="rgb(122,170,255)" fill-opacity="0.14"/>
      <g stroke="rgb(173,178,184)" stroke-width="1.4" stroke-linecap="round">
        <path d="M42 484 L58 484"/>
        <path d="M44 491 L56 491"/>
        <path d="M44 498 L56 498"/>
        <path d="M42 504 L58 504"/>
        <path d="M40 486 L40 502" stroke-opacity="0.45"/>
      </g>
      <text x="64" y="493" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="rgb(249,250,251)">All models (grouped by provider)</text>
      <!-- the built-in rows it sits above -->
      <text x="42" y="519" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="rgb(129,133,140)">Model</text>
      <text x="196" y="519" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="rgb(129,133,140)">GPT-6.2 Sol  ›</text>
    </g>
    <text x="24" y="562" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="rgb(129,133,140)">
      the row this plugin adds to the built-in menu
    </text>
  </g>

  <!-- small legend -->
  <text x="480" y="612" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="rgb(129,133,140)">
    Providers fold · one search field · current model and effort stay in reach
  </text>
</svg>
